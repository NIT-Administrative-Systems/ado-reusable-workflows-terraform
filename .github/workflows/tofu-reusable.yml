name: OpenTofu Checks

on:
  workflow_call:
    inputs:
      run-apply:
        description: 'Whether or not to run tofu apply'
        required: false
        default: false
        type: boolean
      tofu-version:
        description: 'Version of OpenTofu to use'
        required: true
        type: string
      iac-path:
        description: 'relative path to your IAC folder'
        required: false
        default: 'iac/develop'
        type: string
      cache-key-suffix:
        description: 'This workflow uses the actions/cache action to store the comment id so it can be updated on subsequent runs'
        required: false
        default: ''
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        description: 'AWS Access Key ID'
        required: true
      AWS_SECRET_ACCESS_KEY:
        description: 'AWS Secret Access Key'
        required: true
      TF_LOCAL_STATE_ENCRYPTION_KEY:
        description: 'Local state encryption key'
        required: false
      TF_SHARED_RESOURCES_STATE_ENCRYPTION_KEY:
        description: 'Shared resources state encryption key'
        required: false
      TF_SECRETS:
        description: 'JSON formatted array of secrets to be injected into OpenTofu'
        required: false
    outputs:
      tofu-outputs:
        description: "The outputs from tofu apply"
        value: ${{ jobs.opentofu.outputs.tofu-outputs }}
jobs:
  opentofu:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_local_state_passphrase: ${{ secrets.TF_LOCAL_STATE_ENCRYPTION_KEY }}
      TF_VAR_shared_state_passphrase: ${{ secrets.TF_SHARED_RESOURCES_STATE_ENCRYPTION_KEY }}
    outputs:
      tofu-outputs: ${{ steps.apply.outputs.tofu-outputs }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ inputs.tofu-version }}

      - name: Secrets to ENV
        shell: bash
        run: |
          for line in $(echo "${{ secrets.TF_SECRETS }}" | jq -c '.[]' ); do
            name=$(echo $line | jq -r .name)
            value=$(echo $line | jq -r .value)
            echo "$name=$value" >> $GITHUB_ENV
            echo "::add-mask::$value"
          done

      - name: Tofu Format
        working-directory: ${{ inputs.iac-path }}
        id: fmt
        run: tofu fmt -check

      - name: Tofu Init
        id: init
        working-directory: ${{ inputs.iac-path }}
        run: tofu init

      - name: Tofu Validate
        id: validate
        working-directory: ${{ inputs.iac-path }}
        run: tofu validate -no-color

      - name: Tofu Plan
        id: plan
        working-directory: ${{ inputs.iac-path }}
        run: |
          tofu plan -no-color -out=.planfile

      - name: 📊 Comment OpenTofu Plan
        uses: borchero/terraform-plan-comment@v3
        if: always() && github.event_name == 'pull_request'
        with:
          header: "📝 OpenTofu Plan for `${{ inputs.iac-path }}`"
          terraform-cmd: 'tofu'
          working-directory: ${{ inputs.iac-path }}
          planfile: .planfile
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🗑️ Clean Up Temporary Planfile
        if: always()
        run: rm -f .planfile

      - name: 🔍 Check for OpenTofu Plan Errors
        if: always() && steps.plan.outcome == 'failure'
        run: |
          echo "::error::OpenTofu plan failed. Check the plan output above for details."
          exit 1

      - name: Tofu Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Tofu Apply
        id: apply
        if: ${{ inputs.run-apply }}
        working-directory: ${{ inputs.iac-path }}
        run: |
          tofu apply -auto-approve